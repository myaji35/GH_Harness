# GH_Harness CI — Rails/Ruby
# cicd-harness가 CICD_BOOTSTRAP 처리 시 .github/workflows/ci.yml 로 복사.
# 원칙: 존재하지 않는 명령은 넣지 않는다(CI 빨강 방지). 아래 test 스텝은
# bin/rails 존재 시에만 실행되도록 방어. rubocop/스크립트는 프로젝트에 있을 때만 활성.
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests (rails test)
        run: |
          if [ -f bin/rails ] && [ -d test ]; then
            bin/rails test
          elif bundle exec rspec --version >/dev/null 2>&1 && [ -d spec ]; then
            bundle exec rspec
          else
            echo "테스트 스위트 없음 — 스킵 (bootstrap 골격)"
          fi
