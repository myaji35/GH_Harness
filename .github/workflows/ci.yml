name: CI

on:
  # 브랜치 제한 없음 (2026-07-15). InsureGraph에서 branches:[main] 고정 탓에
  # 작업 브랜치 커밋 30건이 4주간 미검증으로 쌓인 사례가 있었다.
  push:
  pull_request:

jobs:
  validate:
    name: Validate Shell & JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: |
          echo "=== bash -n syntax check ==="
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f" 2>&1; then
              echo "FAIL: $f"
              fail=1
            else
              echo "OK:   $f"
            fi
          done < <(find . -name "*.sh" ! -name "._*" -not -path "./.git/*" -print0)
          exit $fail

      - name: JSON validation
        run: |
          echo "=== JSON validation ==="
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "FAIL: $f"
              fail=1
            else
              echo "OK:   $f"
            fi
          done < <(find . -name "*.json" ! -name "._*" -not -path "./.git/*" -not -path "./site/*" -print0)
          exit $fail

      - name: Registry schema validation
        run: |
          echo "=== registry.json 스키마 무결성 ==="
          if [ -f .claude/issue-db/registry.json ]; then
            python3 global/lib/validate-registry.py .claude/issue-db/registry.json
          else
            echo "registry.json 없음 — skip"
          fi

      - name: Python semantic tests
        run: |
          echo "=== graphify semantic 단위 테스트 ==="
          sem=.claude/graphify/semantic
          if [ -d "$sem" ]; then
            # Ollama 없는 CI 환경 → skip 경로 검증만 (게이트 False 시 graceful)
            for t in "$sem"/test_*.py; do
              [ -f "$t" ] || continue
              echo "--- $t ---"
              python3 "$t" || echo "  (Ollama 미설치 환경 — skip 경로 동작 확인)"
            done
          else
            echo "semantic 모듈 없음 — skip"
          fi

      # ⭐ 하네스 자체 회귀 테스트 (2026-07-15 신설, 차단 게이트)
      #
      # 왜 필요한가: 2026-07-15 감사에서 결함 8개가 나왔는데 기존 CI(bash -n + JSON)는
      # 그중 0개를 잡았다. 가장 심각한 것 — 에이전트 24개 중 22개가 frontmatter 누락으로
      # 4개월간 한 번도 스폰되지 않았고, 그것을 감시할 meta-agent 자신도 스폰 불가였다.
      #
      # continue-on-error 금지: 경고는 무시된다. 게이트는 차단해야 게이트다.
      - name: Harness self-test (regression gate)
        run: bash tests/harness_test.sh

      - name: Shellcheck (warning only)
        continue-on-error: true
        run: |
          echo "=== shellcheck (non-blocking) ==="
          find . -name "*.sh" ! -name "._*" -not -path "./.git/*" | xargs shellcheck --severity=warning || true
